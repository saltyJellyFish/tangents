<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css" />
  <!-- No script in head, it goes at the bottom of body so the DOM elements it references already exist when it runs -->
</head>
<body>
    <div id="widget">
        <!-- "ghost" input: near-invisible until focused, adds a task to the queue on Enter -->
        <input id="task-input" class="ghost" placeholder="Focusing on…" />
         <!-- current (active, not-yet-done) task name + chevron toggle to open the full queue panel hidden entirely via CSS until there's an active task — see .has-active-task in style.css -->
        <div id="current-task-row">
          <span id="current-task" tabindex="0" role="button" aria-expanded="false"></span>
          <button id="queue-toggle" class="chevron-btn" aria-label="Show task queue" aria-expanded="false">
            <svg viewBox="0 0 24 24" class="icon-chevron">
              <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <!-- queue panel: opening this now grows the actual OS window (via main.js), it doesn't just overlay -->
        <div id="queue-panel">
          <ul id="queue-list"></ul>
        </div>

        <div id="ring-wrap">
            <!-- SVG ring: two circles stacked on top of each other
            "track" = dim full circle always visible 
            "progress" = colored circle whose visible portion we animate in renders.js
            scroll (wheel) over this whole disc adjusts the timer duration -->
            <svg id="timer-ring" viewBox="0 0 200 200">
                <circle class="track" cx="100" cy="100" r="90" />
                <circle class="progress" id="progress-circle" cx="100" cy="100" r="90" />
            </svg>
    
            <div id="time-display">
                <span id="time-label" tabindex="0" role="button" aria-label="Click to set duration"></span>
                <input id="time-edit" type="text" inputmode="numeric" maxlength="5" aria-label="Enter minutes, or mm:ss" />
            </div>
        </div>
    
         <ul id="subtask-checklist"></ul>
    
        <div id="controls"> 
            <button id="reset-btn" class="icon-btn" aria-label="Reset"> 
                <svg viewBox="0 0 25 25" class="icon-reset">
                    <path d="M21 12a9 9 0 1 1-3-6.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <path d="M21 3v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
    
            <button id="start-pause-btn" class="icon-btn primary" aria-label="Start">
                <svg class="icon-play" viewBox="0 0 25 25"><path d="M7 5v14l12-7z" fill="currentColor" /></svg>
                <svg class="icon-pause" viewBox="0 0 25 25"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" /></svg>
            </button>
        </div>
    </div>
 
  <!-- loaded last so document.getElementById calls inside it succeed -->
  <script src="renders.js"></script>
</body>
</html>
